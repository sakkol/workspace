name: Deploy workspace frontend
on:
  push: { branches: [main], paths: ["web/**"] }
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Require VITE_RELAY_URL (otherwise the page CSP would be broken)
        run: test -n "$VITE_RELAY_URL" || (echo "Set the repository variable VITE_RELAY_URL (Settings > Secrets and variables > Actions > Variables)"; exit 1)
        env: { VITE_RELAY_URL: "${{ vars.VITE_RELAY_URL }}" }
      - run: npm ci
        working-directory: web
      - run: npm test && npm run build
        working-directory: web
        env: { VITE_RELAY_URL: "${{ vars.VITE_RELAY_URL }}", VITE_PLAYER_URL: "${{ vars.VITE_PLAYER_URL }}" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
